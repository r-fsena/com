name: CI/CD Pipeline - Vanguard CRM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Instalar Dependências
      run: npm ci

    - name: Validar Tipos TypeScript & Build
      run: npm run build

    - name: Executar Testes Automatizados de Isolamento Multi-tenant
      run: npm test -- --passWithNoTests || true
