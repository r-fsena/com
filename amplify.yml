version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(NEXT_PUBLIC_|DATABASE_URL=|SESSION_SECRET=|ZAPI_|AWS_S3_|AWS_BEDROCK_|GEMINI_|GOOGLE_GEMINI_API_KEY=|OPENAI_API_KEY=|AI_EXTERNAL_ENABLED=|ASAAS_|AUTOMATIONS_|CAMPAIGNS_|QUALIFICATION_)' > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
