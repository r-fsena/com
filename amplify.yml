version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(NEXT_PUBLIC_|DATABASE_URL=|SESSION_SECRET=|ZAPI_|AWS_S3_|AWS_BEDROCK_|GEMINI_API_KEY=|GOOGLE_GEMINI_API_KEY=|OPENAI_API_KEY=|ASAAS_|AUTOMATIONS_|CAMPAIGNS_)' > .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
